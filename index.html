<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Portal - Login</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body data-page="login">
    <div class="login">
      <div class="card login-card">
        <div class="topbar">
          <div class="brand">
            <div class="logo"></div>
            <div>Agent Portal</div>
          </div>
          <span class="chip">Secure Login</span>
        </div>
        <div class="body">
          <h1>Sign in</h1>
          <p>Use the authorized email and password to access the dashboard.</p>
          <form id="loginForm" autocomplete="off">
            <div class="field">
              <div class="label">Email</div>
              <input id="email" class="input" type="email" placeholder="name@example.com" required />
            </div>
            <div class="field">
              <div class="label">Password</div>
              <input id="password" class="input" type="password" placeholder="••••••••" required />
            </div>
            <div id="loginError" class="error"></div>
            <div class="actions">
              <button class="btn primary" type="submit">Login</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>

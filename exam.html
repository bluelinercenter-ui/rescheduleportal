<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Portal - Select Exam</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body data-page="exam">
    <div class="container">
      <div class="card">
        <div class="topbar">
          <div class="brand">
            <div class="logo"></div>
            <div>Agent Portal</div>
          </div>
          <div style="display:flex;gap:10px;align-items:center">
            <span class="chip" id="sessionChip">-</span>
            <a class="btn" href="dashboard.html">Dashboard</a>
            <button class="btn" id="logoutBtn" type="button">Logout</button>
          </div>
        </div>
        <div class="grid">
          <aside class="sidebar card">
            <h2>Services</h2>
            <div id="serviceNav" class="nav"></div>
          </aside>
          <main class="main">
            <div class="section">
              <h1 id="serviceTitle">Service</h1>
              <p>Select an exam type and fill the information form.</p>
              <div class="tabs" id="examTabs"></div>
            </div>
          </main>
        </div>
      </div>
    </div>
  </body>
</html>
